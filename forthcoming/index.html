<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forthcoming!</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: #fff;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.5rem, 12vw, 9rem);
      line-height: 1;
      letter-spacing: -0.05em;
    }
  </style>
</head>
<body>
  <main>
    <h1>Forthcoming!</h1>
  </main>
</body>
</html>
